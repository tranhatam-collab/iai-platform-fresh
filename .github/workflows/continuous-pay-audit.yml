name: Continuous Pay Audit

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pay audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IAI_PAY_LOOP_OUTPUT_DIR: ${{ runner.temp }}/iai-pay-continuous-dev-loop
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required for scheduled D1 read-only pay audit."
            exit 1
          fi
          pnpm report:pay-continuous

      - name: Upload pay audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iai-pay-continuous-dev-loop
          path: ${{ runner.temp }}/iai-pay-continuous-dev-loop/
          if-no-files-found: warn
