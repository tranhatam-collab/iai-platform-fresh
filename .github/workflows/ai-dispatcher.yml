name: AI Dispatcher

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # docs/** is intentionally not tracked on GitHub, so the config may be absent.
      - name: Load AI system config
        run: |
          if [ -f docs/AI_AUTONOMOUS_CONFIG.json ]; then
            node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('docs/AI_AUTONOMOUS_CONFIG.json','utf8')); console.log('system='+cfg.system_name); console.log('first_activation='+cfg.first_activation);"
          else
            echo "docs/AI_AUTONOMOUS_CONFIG.json is not tracked on GitHub; dispatcher scaffold stays inactive."
          fi

      - name: Guard autonomous dispatcher
        id: guard
        env:
          AI_AUTONOMOUS_ENABLED: ${{ vars.AI_AUTONOMOUS_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${AI_AUTONOMOUS_ENABLED}" != "true" ]; then
            echo "AI_AUTONOMOUS_ENABLED is not true. Dispatcher scaffold is present but inactive."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is missing. Dispatcher scaffold is present but inactive."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Call AI planner
        if: steps.guard.outputs.active == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "AI dispatcher scaffold active."
          echo "Issue number: ${ISSUE_NUMBER}"
          echo "Issue title: ${ISSUE_TITLE}"
          echo "Use docs/AI_TEAM_EXECUTION_SYSTEM.md + docs/PROJECT_CONTEXT_ENGINE.md + docs/AI_MODEL_ROUTING_POLICY.md here."
