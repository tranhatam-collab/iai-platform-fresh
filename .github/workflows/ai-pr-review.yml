name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Universal Quality Gate
        run: pnpm quality:gate

      - name: Guard AI review
        id: guard
        env:
          AI_AUTONOMOUS_ENABLED: ${{ vars.AI_AUTONOMOUS_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${AI_AUTONOMOUS_ENABLED}" != "true" ]; then
            echo "AI_AUTONOMOUS_ENABLED is not true. PR review scaffold is present but inactive."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is missing. PR review scaffold is present but inactive."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Review Code
        if: steps.guard.outputs.active == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "AI PR review scaffold active."
          echo "PR number: ${PR_NUMBER}"
          echo "Run Reviewer AI using docs/AI_TEAM_EXECUTION_SYSTEM.md and docs/PROJECT_CONTEXT_ENGINE.md here."
