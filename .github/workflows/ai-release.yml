name: AI Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit Cloudflare deployment target
        required: true
        type: choice
        options:
          - developer
          - verify-runtime
          - pay
          - trust

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard release automation
        id: release_guard
        run: |
          if [ "${{ vars.AI_RELEASE_ENABLED }}" != "true" ]; then
            echo "AI_RELEASE_ENABLED is not true. Release workflow scaffold is present but inactive."
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Cloudflare secrets are missing. Release workflow scaffold is present but inactive."
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ vars.AI_REQUIRE_HUMAN_APPROVAL }}" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Human approval is required. Use workflow_dispatch after approval."
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.release_guard.outputs.release_enabled == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node cache
        if: steps.release_guard.outputs.release_enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.release_guard.outputs.release_enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Universal Quality Gate
        if: steps.release_guard.outputs.release_enabled == 'true'
        run: pnpm quality:gate

      - name: Source Test Gate
        if: steps.release_guard.outputs.release_enabled == 'true'
        run: pnpm test:source

      - name: Dependency Security Gate
        if: steps.release_guard.outputs.release_enabled == 'true'
        run: pnpm audit --audit-level high

      - name: Deploy
        if: steps.release_guard.outputs.release_enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "${{ inputs.target }}" in
            developer) pnpm exec wrangler deploy --config apps/developer/wrangler.jsonc ;;
            verify-runtime)
              if grep -q 'REPLACE_AFTER_CREATE' apps/verify-runtime/wrangler.toml; then
                echo "verify-runtime D1 resource is not provisioned" >&2
                exit 1
              fi
              pnpm exec wrangler deploy --config apps/verify-runtime/wrangler.toml
              ;;
            pay) pnpm exec wrangler deploy --config pay.iai.one/wrangler.jsonc --env production ;;
            trust)
              pnpm --dir trust-iai-one-starter trust:build-state
              pnpm exec wrangler deploy --config trust-iai-one-starter/wrangler.toml
              ;;
            *) echo "Unknown target" >&2; exit 2 ;;
          esac
