name: AI Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Deploys are Founder-gated: only from main, one at a time.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard release automation
        id: release_guard
        env:
          AI_RELEASE_ENABLED: ${{ vars.AI_RELEASE_ENABLED }}
          AI_REQUIRE_HUMAN_APPROVAL: ${{ vars.AI_REQUIRE_HUMAN_APPROVAL }}
          EVENT_NAME: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${AI_RELEASE_ENABLED}" != "true" ]; then
            echo "AI_RELEASE_ENABLED is not true. Release workflow scaffold is present but inactive."
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare secrets are missing. Release workflow scaffold is present but inactive."
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${AI_REQUIRE_HUMAN_APPROVAL}" = "true" ] && [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "Human approval is required. Use workflow_dispatch after approval."
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.release_guard.outputs.release_enabled == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node cache
        if: steps.release_guard.outputs.release_enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.release_guard.outputs.release_enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Universal Quality Gate
        if: steps.release_guard.outputs.release_enabled == 'true'
        run: pnpm quality:gate

      - name: Deploy
        if: steps.release_guard.outputs.release_enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
