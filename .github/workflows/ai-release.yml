name: AI Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard release automation
        run: |
          if [ "${{ vars.AI_RELEASE_ENABLED }}" != "true" ]; then
            echo "AI_RELEASE_ENABLED is not true. Release workflow scaffold is present but inactive."
            exit 0
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Cloudflare secrets are missing. Release workflow scaffold is present but inactive."
            exit 0
          fi
          if [ "${{ vars.AI_REQUIRE_HUMAN_APPROVAL }}" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Human approval is required. Use workflow_dispatch after approval."
            exit 0
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Universal Quality Gate
        run: pnpm quality:gate

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
