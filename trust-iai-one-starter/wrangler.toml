# To bind trust.iai.one: either (A) move Worker to f3f9e76 or (B) use CF route in f3f9e76 proxying to this Worker.
# Phase 2B decision required — deploying to workers.dev for now.

[vars]
APP_NAME = "trust.iai.one"
DEFAULT_LOCALE = "vi"
PUBLIC_STATUS = "Live"

[[d1_databases]]
binding = "DB"
database_name = "trust_iai_one_db"
database_id = "9ee14f37-f9ed-444d-b988-c91f3d727495"

