name = "trust-iai-one"
main = "src/index.js"
compatibility_date = "2026-04-26"
account_id = "62d57eaa548617aeecac766e5a1cb98e"
workers_dev = true
assets = { directory = "./public", binding = "ASSETS" }

# routes = [{ pattern = "trust.iai.one", custom_domain = true }]
