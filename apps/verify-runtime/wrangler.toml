name = "verify-runtime"
main = "src/index.ts"
compatibility_date = "2026-04-14"
workers_dev = true

# ---------------------------------------------------------------
# CLOUDFLARE BINDINGS
# ---------------------------------------------------------------

# Durable Object for per-workspace atomic quota counter/state.
[[durable_objects.bindings]]
name = "QUOTA_DO"
class_name = "QuotaDurableObject"

# Migration entry required for Durable Object class activation.
[[migrations]]
tag = "v1"
new_classes = ["QuotaDurableObject"]

# D1 database for usage ledger events.
# NOTE: database_id must be replaced after `wrangler d1 create`.
[[d1_databases]]
binding = "USAGE_LEDGER_DB"
database_name = "verify_usage_ledger"
database_id = "REPLACE_AFTER_CREATE"

# Queue for async usage emission.
# NOTE: queue must be created with `wrangler queues create`.
[[queues.producers]]
binding = "USAGE_EVENTS_QUEUE"
queue = "verify-usage-events"

[[queues.consumers]]
queue = "verify-usage-events"
max_batch_size = 10
max_batch_timeout = 5

[vars]
APP_NAME = "verify-runtime"
ENVIRONMENT = "development"
